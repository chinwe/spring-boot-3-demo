# Test configuration for Metrics integration tests
# Disable separate management port and use main server port for actuator endpoints
management.server.port=

# Enable actuator endpoints for testing
management.endpoints.web.exposure.include=health,info,metrics,prometheus,circuitbreakers,ratelimiters,bulkheads
management.endpoint.health.show-details=always

# Metrics configuration for testing
management.metrics.tags.application=demo-test
management.metrics.tags.environment=test

# HTTP request metrics with histogram enabled (testing the change)
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.sla.http.server.requests=50ms,100ms,200ms,500ms,1s,2s
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Enable JVM metrics for testing
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
